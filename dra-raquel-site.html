  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

>\n          <div style=\"aspect-ratio:3/4;background:#E4EADD;border-radius:2px;overflow:hidden;border:6px solid #fff;box-shadow:0 18px 40px rgba(56,73,47,0.18);{{ photoFrameStyle }}\"><img src=\"fc0e47d6-3798-499b-b3e3-39feeb8fda26\" alt=\"Dra. Raquel Ferreira Araujo\" style=\"width:100%;height:100%;object-fit:cover;object-position:top center;\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div data-reveal=\"about2\" style=\"{{ fadeAbout2 }}\">\n          <p style=\"font-family:'Work Sans',sans-serif;text-transform:uppercase;letter-spacing:0.24em;font-size:12.5px;font-weight:600;color:#6C7F5C;margin:0 0 14px;\">A médica<\u002Fp>\n          <h2 style=\"font-size:clamp(26px,3vw,34px);\">Dra. Raquel Ferreira Araujo<\u002Fh2>\n          <p style=\"font-size:14px;color:#6C7F5C;margin:10px 0 26px;letter-spacing:0.02em;\">Endocrinologista Pediátrica · CRM-MG 50787 · RQE 331977<\u002Fp>\n          <p>Aliando sólida formação, constante atualização e atendimento humanizado, dedica-se ao cuidado integral de crianças e adolescentes com doenças endócrinas, acompanhando cada paciente de forma individualizada e baseada nas melhores evidências científicas.<\u002Fp>\n          <p style=\"font-family:'Work Sans',sans-serif;text-transform:uppercase;letter-spacing:0.24em;font-size:12.5px;font-weight:600;color:#6C7F5C;margin:34px 0 14px;\">Formação<\u002Fp>\n          <p>Dra. Raquel Ferreira Araújo é médica graduada pela Universidade Federal de Minas Gerais (UFMG).<\u002Fp>\n          <p>Realizou residência médica em Pediatria no Hospital IPSEMG, em Belo Horizonte, e, posteriormente, especializou-se em Endocrinologia Pediátrica por meio da residência médica no Hospital das Clínicas da UFMG, um dos principais centros de referência do país.<\u002Fp>\n          <p>É mestre em Saúde da Criança e do Adolescente pela Universidade Federal de Minas Gerais (UFMG), consolidando sua formação acadêmica e científica.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"especialidade\" style=\"position:relative;overflow:hidden;padding:{{ sectionPadding }};background:#E4EADD;\">\n    <div style=\"position:absolute;width:clamp(160px,22vw,300px);opacity:0.16;pointer-events:none;z-index:0;top:-50px;right:-60px;\"><img src=\"031212be-d5a4-4b0b-86c8-d832c5a2a899\" alt=\"\" style=\"width:100%;\"><\u002Fdiv>\n    <div style=\"max-width:1120px;margin:0 auto;padding:0 32px;position:relative;z-index:1;\">\n      <div data-reveal=\"spechead\" style=\"max-width:620px;margin-bottom:52px;{{ fadeSpecHead }}\">\n        <p style=\"font-family:'Work Sans',sans-serif;text-transform:uppercase;letter-spacing:0.24em;font-size:12.5px;font-weight:600;color:#6C7F5C;margin:0 0 14px;\">Especialidade<\u002Fp>\n        <h2 style=\"font-size:clamp(26px,3vw,34px);\">O que trata a endocrinologia pediátrica<\u002Fh2>\n        <p>A especialidade cuida do funcionamento das glândulas e dos hormônios que regulam o crescimento, a puberdade, o peso e a saúde óssea de crianças e adolescentes. Entre as situações mais acompanhadas em consultório estão:<\u002Fp>\n      <\u002Fdiv>\n      <ul data-reveal=\"speclist\" style=\"{{ conditionListStyle }} {{ fadeSpecList }}\">\n        <sc-for list=\"{{ conditions }}\" as=\"item\" hint-placeholder-count=\"8\">\n          <li style=\"display:flex;gap:12px;align-items:flex-start;font-size:15px;padding:14px 0;border-bottom:1px solid #D9D5C6;\">\n            <svg sc-camel-view-box=\"0 0 16 16\" style=\"flex:none;width:16px;height:16px;margin-top:3px;\"><path d=\"M8 1c4 2 6 6 6 9-3 1-7 0-9-3C3 4 5 2 8 1z\" fill=\"none\" stroke=\"#6C7F5C\" stroke-width=\"1.3\"><\u002Fpath><\u002Fsvg>\n            {{ item }}\n          <\u002Fli>\n        <\u002Fsc-for>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"agendar\" style=\"position:relative;overflow:hidden;padding:{{ sectionPadding }};\">\n    <div style=\"max-width:1120px;margin:0 auto;padding:0 32px;\">\n      <div style=\"{{ scheduleGridStyle }}\">\n        <div data-reveal=\"schedleft\" style=\"{{ fadeSchedLeft }}\">\n          <p style=\"font-family:'Work Sans',sans-serif;text-transform:uppercase;letter-spacing:0.24em;font-size:12.5px;font-weight:600;color:#6C7F5C;margin:0 0 14px;\">Agendamento<\u002Fp>\n          <h2 style=\"font-size:clamp(26px,3vw,34px);\">Vamos agendar a consulta?<\u002Fh2>\n          <p style=\"margin-top:14px;\">Preencha os dados ao lado com o nome do responsável, a idade da criança e o motivo da consulta. Entraremos em contato para confirmar o melhor horário.<\u002Fp>\n          <div style=\"background:#FFFFFF;border:1px solid #D9D5C6;padding:28px;border-radius:2px;margin-top:28px;\">\n            <div style=\"font-size:14px;margin-bottom:10px;color:#6A7361;\"><strong style=\"color:#38492F;display:block;font-size:13px;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:2px;\">Endereço<\u002Fstrong>Rua Paracatu, 878 — sala 702, Barro Preto · Belo Horizonte, MG<\u002Fdiv>\n            <div style=\"font-size:14px;margin-bottom:10px;color:#6A7361;\"><strong style=\"color:#38492F;display:block;font-size:13px;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:2px;\">Telefone<\u002Fstrong>(31) 3337-1663 · (31) 99961-1663<\u002Fdiv>\n            <div style=\"font-size:14px;margin-bottom:10px;color:#6A7361;\"><strong style=\"color:#38492F;display:block;font-size:13px;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:2px;\">E-mail<\u002Fstrong>rmangelli@gmail.com<\u002Fdiv>\n            <div style=\"font-size:14px;margin-bottom:10px;color:#6A7361;\"><strong style=\"color:#38492F;display:block;font-size:13px;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:2px;\">Registro<\u002Fstrong>CRM-MG 50787 · RQE 331977<\u002Fdiv>\n            <a href=\"https://wa.me/5531999611663?text=Ol%C3%A1%21%20Gostaria%20de%20agendar%20uma%20consulta.\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:#38492F;font-size:14px;font-weight:500;margin-top:6px;\" style-hover=\"color:#C08A3E;\">\n              <svg sc-camel-view-box=\"0 0 20 20\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:18px;height:18px;flex:none;\"><path d=\"M10 2a8 8 0 0 0-6.9 12l-1 3.8 3.9-1A8 8 0 1 0 10 2z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Fpath><path d=\"M7 7.5c0 3 2.5 5.5 5.5 5.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n              Chamar no WhatsApp\n            <\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div data-reveal=\"schedright\" style=\"{{ fadeSchedRight }}\">\n          <sc-if value=\"{{ formSent }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#E4EADD;border:1px solid #D9D5C6;border-radius:2px;padding:32px 28px;\">\n              <h3 style=\"font-size:19px;margin-bottom:8px;\">Solicitação enviada!<\u002Fh3>\n              <p style=\"margin:0;\">Obrigado pelo contato. Retornaremos em breve para confirmar o melhor horário.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ formNotSent }}\" hint-placeholder-val=\"{{ true }}\">\n          <form sc-camel-on-submit=\"{{ handleSubmit }}\" ref=\"{{ setFormRef }}\" style=\"display:flex;flex-direction:column;gap:16px;\">\n            <div style=\"{{ fieldRowStyle }}\">\n              <div style=\"display:flex;flex-direction:column;gap:6px;\"><label for=\"resp\" style=\"font-size:12.5px;text-transform:uppercase;letter-spacing:0.06em;color:#6A7361;\">Nome do responsável<\u002Flabel><input id=\"resp\" name=\"resp\" type=\"text\" required=\"{{ true }}\" style=\"border:1px solid #D9D5C6;background:#FFFFFF;padding:12px 14px;font-family:'Work Sans',sans-serif;font-size:14.5px;border-radius:2px;color:#26301F;\" style-focus=\"outline:2px solid #C08A3E;outline-offset:1px;border-color:#C08A3E;\"><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:6px; 06em;color:#6A7361;\">Data preferencial<\u002Flabel><input id=\"data\" name=\"data_preferencial\" type=\"date\" min=\"{{ minDate }}\" title=\"Escolha uma data futura\" style=\"border:1px solid #D9D5C6;background:#FFFFFF;padding:12px 14px;font-family:'Work Sans',sans-serif;font-size:14.5px;border-radius:2px;color:#26301F;\" style-focus=\"outline:2px solid #C08A3E;outline-offset:1px;border-color:#C08A3E;\"><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px;\"><label for=\"obs\" style=\"font-size:12.5px;text-transform:uppercase;letter-spacing:0.06em;color:#6A7361;\">Observações<\u002Flabel><textarea id=\"obs\" name=\"observacoes\" rows=\"3\" placeholder=\"Idade da criança, motivo da consulta...\" style=\"border:1px solid #D9D5C6;background:#FFFFFF;padding:12px 14px;font-family:'Work Sans',sans-serif;font-size:14.5px;border-radius:2px;color:#26301F;resize:vertical;\" style-focus=\"outline:2px solid #C08A3E;outline-offset:1px;border-color:#C08A3E;\"><\u002Ftextarea><\u002Fdiv>\n            <input type=\"hidden\" name=\"_subject\" value=\"Nova solicitação de consulta — site Dra. Raquel\">\n            <input type=\"hidden\" name=\"_captcha\" value=\"false\">\n            <button type=\"submit\" disabled=\"{{ sending }}\" style=\"{{ submitBtnStyle }}\" style-hover=\"transform:translateY(-2px);box-shadow:0 8px 20px rgba(192,138,62,0.3);background:#AD7A34;\">{{ submitLabel }}<\u002Fbutton>\n            <sc-if value=\"{{ formError }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"font-size:13px;color:#B3452F;margin:0;\">Não foi possível enviar agora. Tente novamente ou fale pelo WhatsApp.<\u002Fp>\n            <\u002Fsc-if>\n            <p style=\"font-size:12.5px;color:#6A7361;margin-top:4px;\">Ao enviar, entraremos em contato por e-mail ou telefone para confirmar o agendamento.<\u002Fp>\n          <\u002Fform>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"background:#38492F;color:#EFEFE6;padding:64px 0 32px;position:relative;overflow:hidden;\">\n    <div style=\"position:absolute;left:-110px;bottom:-90px;width:420px;opacity:0.14;transform:rotate(180deg);\"><img src=\"031212be-d5a4-4b0b-86c8-d832c5a2a899\" alt=\"\" style=\"width:100%;\"><\u002Fdiv>\n    <div style=\"max-width:1120px;margin:0 auto;padding:0 32px;position:relative;display:flex;justify-content:space-between;flex-wrap:wrap;gap:32px;\">\n      <div>\n        <div style=\"font-family:'Fraunces',serif;font-size:20px;margin-bottom:8px;color:#fff;display:flex;align-items:center;gap:10px;\">\n          <svg sc-camel-view-box=\"0 0 64 64\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:26px;height:26px;\">\n            <path d=\"M9 53 C 19 51, 25 37, 31 31 C 37 25, 41 20, 46 14\" fill=\"none\" stroke=\"#EFEFE6\" stroke-width=\"3.4\" stroke-linecap=\"round\"><\u002Fpath>\n            <g transform=\"translate(21,37) rotate(-35) scale(1.05)\"><path d=\"M8 1c4 2 6 6 6 9-3 1-7 0-9-3C3 4 5 2 8 1z\" fill=\"none\" stroke=\"#EFEFE6\" stroke-width=\"2.1\"><\u002Fpath><\u002Fg>\n            <g transform=\"translate(35,21) rotate(25) scale(1.05)\"><path d=\"M8 1c4 2 6 6 6 9-3 1-7 0-9-3C3 4 5 2 8 1z\" fill=\"none\" stroke=\"#EFEFE6\" stroke-width=\"2.1\"><\u002Fpath><\u002Fg>\n            <circle cx=\"46\" cy=\"14\" r=\"4\" fill=\"#C08A3E\"><\u002Fcircle>\n          <\u002Fsvg>\n          Dra. Raquel Ferreira Araujo\n        <\u002Fdiv>\n        <div style=\"font-size:13px;color:#C7CDBC;margin-bottom:22px;\">Endocrinologista Pediátrica · CRM-MG 50787 · RQE 331977<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:13.5px;color:#D8DCCB;margin-bottom:8px;\"><a href=\"https://www.google.com/maps/search/?api=1&amp;query=Rua+Paracatu+878+Barro+Preto+Belo+Horizonte+MG\" target=\"_blank\" rel=\"noopener\" style=\"color:#D8DCCB;text-decoration:underline;\" style-hover=\"color:#C08A3E;\">Rua Paracatu, 878 — sala 702, Barro Preto, BH/MG<\u002Fa><\u002Fdiv>\n        <div style=\"font-size:13.5px;color:#D8DCCB;margin-bottom:8px;\">(31) 3337-1663 · (31) 99961-1663<\u002Fdiv>\n        <div style=\"font-size:13.5px;color:#D8DCCB;margin-bottom:8px;\">rmangelli@gmail.com<\u002Fdiv>\n        <a href=\"https://wa.me/5531999611663?text=Ol%C3%A1%21%20Gostaria%20de%20agendar%20uma%20consulta.\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:#D8DCCB;font-size:14px;font-weight:500;margin-top:8px;\" style-hover=\"color:#C08A3E;\">\n          <svg sc-camel-view-box=\"0 0 20 20\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:18px;height:18px;flex:none;\"><path d=\"M10 2a8 8 0 0 0-6.9 12l-1 3.8 3.9-1A8 8 0 1 0 10 2z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Fpath><path d=\"M7 7.5c0 3 2.5 5.5 5.5 5.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n          WhatsApp\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width:1120px;margin:0 auto;padding:0 32px;border-top:1px solid rgba(255,255,255,0.12);margin-top:44px;padding-top:20px;font-size:12px;color:#9AA48C;position:relative;\">Protótipo de identidade visual — conteúdo de exemplo, a confirmar.<\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    navOpen: false,\n    isMobile: (typeof window !== 'undefined' && window.innerWidth <= 860),\n    heroIn: false,\n    visible: {},\n    sending: false,\n    sent: false,\n    error: false\n  };\n\n  conditions = [\n    'Avaliação de baixa ou alta estatura',\n    'Puberdade precoce ou atrasada',\n    'Diabetes mellitus (tipo 1, tipo 2 e outras formas)',\n    'Alterações de tireoide',\n    'Obesidade infantil e questões metabólicas',\n    'Distúrbios da diferenciação sexual',\n    'Alterações de suprarrenal e hipófise',\n    'Saúde óssea (baixa densidade, raquitismo)'\n  ];\n\n  componentDidMount() {\n    this._onResize = () => {\n      const isMobile = window.innerWidth <= 860;\n      if (isMobile !== this.state.isMobile) this.setState({ isMobile, navOpen: isMobile ? this.state.navOpen : false });\n    };\n    window.addEventListener('resize', this._onResize);\n\n    this._heroTimeout = setTimeout(() => this.setState({ heroIn: true }), 200);\n\n    if (this.rootEl) {\n      this._io = new IntersectionObserver((entries) => {\n        entries.forEach((en) => {\n          if (en.isIntersecting) {\n            const key = en.target.getAttribute('data-reveal');\n            this.setState((s) => ({ visible: { ...s.visible, [key]: true } }));\n            this._io.unobserve(en.target);\n          }\n        });\n      }, { threshold: 0.15 });\n      this.rootEl.querySelectorAll('[data-reveal]').forEach((el) => this._io.observe(el));\n    }\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('resize', this._onResize);\n    clearTimeout(this._heroTimeout);\n    if (this._io) this._io.disconnect();\n  }\n\n  setRootRef = (el) => { this.rootEl = el; };\n  setFormRef = (el) => { this.formEl = el; };\n  toggleNav = () => this.setState((s) => ({ navOpen: !s.navOpen }));\n  closeNav = () => this.setState({ navOpen: false });\n  handleSubmit = async (e) => {\n    e.preventDefault();\n    if (this.state.sending) return;\n    if (this.formEl && !this.formEl.checkValidity()) {\n      this.formEl.reportValidity();\n      return;\n    }\n    this.setState({ sending: true, error: false });\n    try {\n      const res = await fetch('https://formsubmit.co/ajax/rmangelli@gmail.com', {\n        method: 'POST',\n        headers: { 'Accept': 'application/json' },\n        body: new FormData(this.formEl)\n      });\n      if (!res.ok) throw new Error('bad status');\n      this.setState({ sending: false, sent: true });\n    } catch (err) {\n      this.setState({ sending: false, error: true });\n    }\n  };\n\n  renderVals() {\n    const { navOpen, isMobile, heroIn, visible, sending, sent, error } = this.state;\n\n    const fadeStyle = (key) =>\n      `opacity:${visible[key] ? 1 : 0};transform:translateY(${visible[key] ? 0 : 18}px);transition:opacity .8s ease, transform .8s ease;`;\n\n    return {\n      setRootRef: this.setRootRef,\n      setFormRef: this.setFormRef,\n      toggleNav: this.toggleNav,\n      closeNav: this.closeNav,\n      handleSubmit: this.handleSubmit,\n      isMobile,\n      navAriaExpanded: navOpen ? 'true' : 'false',\n      conditions: this.conditions,\n      sending,\n      formSent: sent,\n      formNotSent: !sent,\n      formError: error,\n      submitLabel: sending ? 'Enviando...' : 'Enviar solicitação',\n      minDate: (() => {\n        const d = new Date();\n        d.setDate(d.getDate() + 1);\n        return d.toISOString().slice(0, 10);\n      })(),\n      submitBtnStyle: `align-self:flex-start;margin-top:6px;background:${sending ? '#8A8A7A' : '#C08A3E'};color:#fff;text-decoration:none;font-size:14.5px;padding:14px 30px;border-radius:2px;letter-spacing:0.02em;font-weight:500;border:none;cursor:${sending ? 'not-allowed' : 'pointer'};font-family:'Work Sans',sans-serif;transition:transform .2s ease, box-shadow .2s ease, background .2s ease;`,\n\n      navSpan1Style: `display:block;width:22px;height:2px;background:#38492F;transition:transform .25s ease, opacity .25s ease;${navOpen ? 'transform:translateY(7px) rotate(45deg);' : ''}`,\n      navSpan2Style: `display:block;width:22px;height:2px;background:#38492F;transition:transform .25s ease, opacity .25s ease;${navOpen ? 'opacity:0;' : ''}`,\n      navSpan3Style: `display:block;width:22px;height:2px;background:#38492F;transition:transform .25s ease, opacity .25s ease;${navOpen ? 'transform:translateY(-7px) rotate(-45deg);' : ''}`,\n\n      navLinksStyle: isMobile\n        ? `display:flex;flex-direction:column;align-items:stretch;gap:0;position:fixed;top:64px;left:0;right:0;z-index:45;background:#F8F6EF;border-bottom:1px solid #D9D5C6;padding:8px 24px 22px;transform:translateY(${navOpen ? 0 : -12}px);opacity:${navOpen ? 1 : 0};pointer-events:${navOpen ? 'auto' : 'none'};transition:transform .25s ease, opacity .25s ease;`\n        : `display:flex;align-items:center;gap:36px;list-style:none;margin:0;padding:0;`,\n      navLiStyle: isMobile ? 'width:100%;' : '',\n      navLinkStyle: isMobile\n        ? 'display:block;padding:14px 2px;font-size:16px;text-decoration:none;'\n        : 'display:inline-block;font-size:14.5px;text-decoration:none;',\n      navCtaMarginTop: isMobile ? '6px' : '0',\n\n      heroPadding: isMobile ? '84px 0 56px' : '108px 0 90px',\n      sectionPadding: isMobile ? '64px 0' : '96px 0',\n      ctaRowStyle: isMobile\n        ? 'display:flex;flex-direction:column;align-items:stretch;gap:16px;'\n        : 'display:flex;align-items:center;gap:16px;flex-wrap:wrap;',\n\n      heroBranchStyle: `position:absolute;top:-46px;right:-40px;width:${isMobile ? '220px' : 'clamp(220px,42%,520px)'};opacity:${isMobile ? 0.4 : 0.6};pointer-events:none;transform:rotate(180deg);clip-path:inset(0 0 ${heroIn ? 0 : 100}% 0);transition:clip-path 1.6s cubic-bezier(.16,.72,.28,1);`,\n      heroInnerStyle: `position:relative;max-width:${isMobile ? 'none' : '46%'};`,\n\n      aboutGridStyle: `display:grid;grid-template-columns:${isMobile ? '1fr' : '280px 1fr'};gap:${isMobile ? '32px' : '56px'};align-items:start;`,\n      photoFrameStyle: isMobile ? 'max-width:240px;' : '',\n      conditionListStyle: `display:grid;grid-template-columns:repeat(${isMobile ? 1 : 2},1fr);gap:14px 40px;margin-top:40px;`,\n      scheduleGridStyle: `display:grid;grid-template-columns:${isMobile ? '1fr' : '1fr 1fr'};gap:${isMobile ? '40px' : '64px'};align-items:start;`,\n      fieldRowStyle: `display:grid;grid-template-columns:${isMobile ? '1fr' : '1fr 1fr'};gap:16px;`,\n\n      fadeAbout1: fadeStyle('about1'),\n      fadeAbout2: fadeStyle('about2'),\n      fadeSpecHead: fadeStyle('spechead'),\n      fadeSpecList: fadeStyle(
